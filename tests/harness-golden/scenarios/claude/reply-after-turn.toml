# Claude Code: a turn ends, and a bracketed paste and Enter send the next prompt, as `agent.reply`
# writes it (`06 §7`, D-197). The text has two lines, so it shows that a paste with a new line is
# one prompt.
harness = "claude"
cols = 120
rows = 40

[[turn]]
blocks = [{ type = "text", text = "The first turn is done." }]

[[turn]]
blocks = [{ type = "text", text = "The reply arrived." }]

# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
# Claude Code names the time it worked with a verb that it picks at random.
pattern = "✻ \\S+ for [0-9hms ]+ · done \\d+:\\d+ [AP]M"
with = "✻ <verb> for <time spent> · done <time>"

[[mask]]
pattern = "claude --resume [0-9a-f-]{36}"
with = "claude --resume <session>"

[[step]]
wait_signal = "SessionStart"

[[step]]
wait_screen = "^❯"

[[step]]
send = "start"

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
wait_screen = "The first turn is done\\."

[[step]]
snapshot = "turn-ended"

# What `agent.reply` writes: the text in a bracketed paste, a pause, and a carriage return.
[[step]]
send = "\u001b[200~next step\nwith a second line\u001b[201~"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_signal = "UserPromptSubmit"

[[step]]
wait_signal = "Stop"

[[step]]
wait_screen = "The reply arrived\\."

[[step]]
snapshot = "replied"

[[step]]
send = "/exit"

[[step]]
key = "enter"

[[step]]
expect_exit = true
