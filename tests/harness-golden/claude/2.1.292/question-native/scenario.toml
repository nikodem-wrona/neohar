# Claude Code: AskUserQuestion with no hook reply. The user answers in the dialog with the keys down and enter.
harness = "claude"
cols = 120
rows = 40


[state]
hasSeenAutoDefaultNudge = true

[settings.permissions]
defaultMode = "default"

[[turn]]
blocks = [{ type = "tool_use", name = "AskUserQuestion", input = { questions = [{ question = "Which color do you want?", header = "Color", multiSelect = false, options = [{ label = "Red", description = "A warm color" }, { label = "Blue", description = "A cool color" }] }] } }]

[[turn]]
blocks = [{ type = "text", text = "Noted." }]

# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
# Claude Code names the time it worked with a verb that it picks at random.
pattern = "✻ \\S+ for [0-9hms ]+ · done \\d+:\\d+ [AP]M"
with = "✻ <verb> for <time spent> · done <time>"

[[mask]]
pattern = "claude --resume [0-9a-f-]{36}"
with = "claude --resume <session>"

[[step]]
wait_signal = "SessionStart"

[[step]]
wait_screen = "^❯"

[[step]]
send = "ask me a question"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_screen = "Which color"

[[step]]
snapshot = "dialog"

[[step]]
key = "down"

[[step]]
sleep_ms = 300

[[step]]
snapshot = "dialog-blue"

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
snapshot = "answered"


[[step]]
send = "/exit"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
expect_exit = true
