<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="The Workflows view: connect agent nodes, read one report" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><style>svg{--edge:#8c959f;--grid:#d0d7de;--accent:#0969da;--good:#1a7f37;--warn:#9a6700;--bad:#cf222e;--tint:#f6f8fa;--ink:#1f2328;--quiet:#59636e;--on-accent:#ffffff;background:#ffffff}@media (prefers-color-scheme: dark){svg{--edge:#6e7681;--grid:#30363d;--accent:#4493f8;--good:#3fb950;--warn:#d29922;--bad:#f85149;--tint:#161b22;--ink:#e6edf3;--quiet:#9198a1;--on-accent:#0d1117;background:#0d1117}}</style><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="0.9" style="fill:var(--grid)"></circle></pattern></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill:var(--ink)">The Workflows view: connect agent nodes, read one report</text><text x="24" y="50" style="fill:var(--quiet)">Sample data. Accent: the selected node. Green: done. Amber: working. Red: needs you.</text><rect x="24" y="64" width="712" height="400" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--edge)"></rect><g><path d="M196 64V104M380 64V104M24 104H736" fill="none" stroke-width="1" style="stroke:var(--grid)"></path><text x="40" y="81" style="fill:var(--quiet)">Folder</text><text x="40" y="97" font-size="13" font-weight="600" style="fill:var(--ink)">neohar</text><text x="212" y="81" style="fill:var(--quiet)">Branch</text><text x="212" y="97" font-size="13" font-weight="600" style="fill:var(--ink)">feat/refunds</text><text x="396" y="81" style="fill:var(--quiet)">Workflow</text><text x="396" y="97" font-size="13" font-weight="600" style="fill:var(--ink)">Review · execution 3</text><rect x="592" y="74" width="128" height="22" rx="11" style="fill:var(--accent)"></rect><text x="656" y="89" text-anchor="middle" font-weight="600" style="fill:var(--on-accent)">▶ Execute workflow</text