" y="276" font-weight="600" style="fill:var(--ink)">▶ Manual trigger</text><text x="212" y="292" font-size="10.5" style="fill:var(--quiet)">base main</text><rect x="360" y="136" width="180" height="60" rx="8" stroke-width="1.25" style="fill:var(--tint);stroke:var(--good)"></rect><text x="372" y="156" font-weight="600" style="fill:var(--ink)">Code review</text><text x="372" y="172" font-size="10.5" style="fill:var(--quiet)">Codex · gpt-5.5 · high</text><text x="372" y="188" font-size="10.5" style="fill:var(--good)">✓ done · 6 min · warn</text><rect x="360" y="250" width="180" height="60" rx="8" stroke-width="2" style="fill:var(--tint);stroke:var(--accent)"></rect><text x="372" y="270" font-weight="600" style="fill:var(--ink)">Business-logic review</text><text x="372" y="286" font-size="10.5" style="fill:var(--quiet)">Claude Code · opus</text><text x="372" y="302" font-size="10.5" style="fill:var(--warn)">● working · 4 min</text><rect x="360" y="364" width="180" height="60" rx="8" stroke-width="1.25" style="fill:var(--tint);stroke:var(--bad)"></rect><text x="372" y="384" font-weight="600" style="fill:var(--ink)">Security review</text><text x="372" y="400" font-size="10.5" style="fill:var(--quiet)">Claude Code · /security-review</text><text x="372" y="416" font-size="10.5" style="fill:var(--bad)">! needs you · question</text><rect x="576" y="250" width="146" height="60" rx="8" stroke-width="1.25" style="fill:var(--tint);stroke:var(--edge)"></rect><text x="588" y="270" font-weight="600" style="fill:var(--ink)">Review report</text><text x="588" y="286" font-size="10.5" style="fill:var(--quiet)">summary by Claude Code</text><text x="588" y="302" font-size="10.5" style="fill:var(--quiet)">waiting for 2 inputs</text></g><g stroke-width="1.25"><circle cx="324" cy="280" r="4" style="fill:var(--tint);stroke:var(--edge)"></circle><circle cx="360" cy="166" r="4" style="fill:var(--tint);stroke:var(--edge)"></circle><circle cx="540" cy="166" r="4" style="fill:var(--tint);stroke:var(--edge)"></circle><circle cx="360" cy="280" r="4" style="fill:var(--tint);stroke:var(--edge)"></circle><circle cx="540" cy="280" r="4" style="fill:var(--tint);stroke:var(--edge)"></circle><circle cx="360" cy="394" r="4" style="fill:var(--tint);stroke:var(--edge)"></circle><circle cx="540" cy="394" r="4" style="fill:var(--tint);stroke:var(--edge)"></circle><circle cx="576" cy="280" r="4" style="fill:var(--tint);stroke:var(--edge)"></circle></g><g><rect x="200" y="434" width="176" height="20" rx="10" fill="none" stroke-width="1" style="stroke:var(--grid)"></rect><text x="288" y="448" text-anchor="middle" font-size="10.5" style="fill:var(--quiet)">−   100 %   +   ·   Fit   ·   Tidy up</text><text x="720" y="448" text-anchor="end" font-size="10.5" style="fill:var(--quiet)">Drag from a port to add a node</text></g><text x="24" y="488" style="fill:var(--quiet)">Each agent node writes its report: code.md, logic.md, security.md. The Report node writes report.md with links to them.</text></svg>
