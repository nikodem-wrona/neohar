# Claude Code: an MCP server asks for input (elicitation/create). An Elicitation hook answers with action accept and content, and no dialog opens.
harness = "claude"
cols = 120
rows = 40
args = ["--mcp-config", "{scratch}/mcp.json", "--strict-mcp-config"]

[[file]]
path = "{scratch}/mcp.json"
content = '{"mcpServers":{"golden":{"command":"{golden}","args":["mcp-elicit"]}}}'

[state]
hasSeenAutoDefaultNudge = true

[settings.permissions]
defaultMode = "default"
allow = ["mcp__golden__ask"]

[[hook_reply]]
event = "Elicitation"
reply = { hookSpecificOutput = { hookEventName = "Elicitation", action = "accept", content = { color = "red" } } }

[[turn]]
blocks = [{ type = "tool_use", name = "mcp__golden__ask", input = {} }]

[[turn]]
blocks = [{ type = "text", text = "Noted." }]

# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
# Claude Code names the time it worked with a verb that it picks at random.
pattern = "✻ \\S+ for [0-9hms ]+ · done \\d+:\\d+ [AP]M"
with = "✻ <verb> for <time spent> · done <time>"

[[mask]]
pattern = "claude --resume [0-9a-f-]{36}"
with = "claude --resume <session>"

[[step]]
wait_signal = "SessionStart"

[[step]]
wait_screen = "^❯"

[[step]]
send = "ask the server"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
snapshot = "answered"

[[step]]
send = "/exit"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
expect_exit = true
