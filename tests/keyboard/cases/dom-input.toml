[[case]]
name = "macOS Option+Shift+A with both Options as Alt: ESC A"
platform = "macos"
config = { macos_option_as_alt = "both" }
events = [{ type = "keydown", key = "Å", code = "KeyA", alt = true, shift = true, key_code = 65 }]
logical = [{ type = "key", code = "KeyA", key = "A", mods = ["shift", "alt"], kind = "press", text = "A", location = 0 }]
expect = "1b41"
source = "xterm ctlseqs, Alt and Meta Keys: ESC and the character of the key"

[[case]]
name = "macOS Option+1 with both Options as Alt: ESC 1"
platform = "macos"
config = { macos_option_as_alt = "both" }
events = [{ type = "keydown", key = "¡", code = "Digit1", alt = true, key_code = 49 }]
logical = [{ type = "key", code = "Digit1", key = "1", mods = ["alt"], kind = "press", text = "1", location = 0 }]
expect = "1b31"
source = "xterm ctlseqs, Alt and Meta Keys: ESC and the character of the key"

[[case]]
name = "macOS Option+/ with both Options as Alt: ESC /"
platform = "macos"
config = { macos_option_as_alt = "both" }
events = [{ type = "keydown", key = "÷", code = "Slash", alt = true, key_code = 191 }]
logical = [{ type = "key", code = "Slash", key = "/", mods = ["alt"], kind = "press", text = "/", location = 0 }]
expect = "1b2f"
source = "xterm ctlseqs, Alt and Meta Keys: ESC and the character of the key"

[[case]]
name = "macOS Option+E (a dead key) with both Options as Alt: ESC e"
platform = "macos"
config = { macos_option_as_alt = "both" }
events = [{ type = "keydown", key = "Dead", code = "KeyE", alt = true, key_code = 229 }]
logical = [{ type = "key", code = "KeyE", key = "e", mods = ["alt"], kind = "press", text = "e", location = 0 }]
expect = "1b65"
source = "xterm ctlseqs, Alt and Meta Keys: ESC and the character of the key"

[[case]]
name = "macOS Option+E (a dead key) with Option as Alt off: nothing yet"
platform = "macos"
events = [{ type = "keydown", key = "Dead", code = "KeyE", alt = true, key_code = 229 }]
logical = []
expect = ""
source = "The input method owns the key; the composition delivers the text"

[[case]]
name = "macOS Ctrl+Option+A with both Options as Alt: ESC and C0"
platform = "macos"
config = { macos_option_as_alt = "both" }
events = [{ type = "keydown", key = "å", code = "KeyA", alt = true, ctrl = true, key_code = 65 }]
logical = [{ type = "key", code = "KeyA", key = "a", mods = ["ctrl", "alt"], kind = "press", location = 0 }]
expect = "1b01"
source = "xterm ctlseqs: Alt sends ESC first, Ctrl+A is 0x01"

[[case]]
name = "macOS Option+Left keeps Alt whatever the setting"
platform = "macos"
events = [{ type = "keydown", key = "ArrowLeft", code = "ArrowLeft", alt = true, key_code = 37 }]
logical = [{ type = "key", code = "ArrowLeft", key = "ArrowLeft", mods = ["alt"], kind = "press", location = 0 }]
expect = "1b5b313b3344"
source = "xterm ctlseqs, PC-Style Function Keys: CSI 1 ; 3 D"

[[case]]
name = "macOS Option+Backspace with both Options as Alt: ESC DEL"
platform = "macos"
config = { macos_option_as_alt = "both" }
events = [{ type = "keydown", key = "Backspace", code = "Backspace", alt = true, key_code = 8 }]
logical = [{ type = "key", code = "Backspace", key = "Backspace", mods = ["alt"], kind = "press", location = 0 }]
expect = "1b7f"
source = "xterm ctlseqs, Alt and Meta Keys: ESC and DEL"

[[case]]
name = "macOS Option+A with both Options as Alt and kitty flag 1: CSI u"
platform = "macos"
kitty = 1
config = { macos_option_as_alt = "both" }
events = [{ type = "keydown", key = "å", code = "KeyA", alt = true, key_code = 65 }]
logical = [{ type = "key", code = "KeyA", key = "a", mods = ["alt"], kind = "press", text = "a", location = 0 }]
expect = "1b5b39373b3375"
source = "kitty keyboard protocol, flag 1: alt+a is CSI 97 ; 3 u"

[[case]]
name = "macOS Option+A with Option as Alt off and kitty flag 1: å is text"
platform = "macos"
kitty = 1
events = [{ type = "keydown", key = "å", code = "KeyA", alt = true, key_code = 65 }]
logical = [{ type = "key", code = "KeyA", key = "å", mods = [], kind = "press", text = "å", location = 0 }]
expect = "c3a5"
source = "kitty keyboard protocol, flag 1: keys that produce text are sent as text"

# --- keys of the browser that no terminal has ---

[[case]]
name = "unidentified key sends nothing"
events = [{ type = "keydown", key = "Unidentified", code = "", key_code = 0 }]
logical = [{ type = "key", code = "", key = "Unidentified", mods = [], kind = "press", location = 0 }]
expect = ""
source = "no terminal encoding exists"

[[case]]
name = "shift alone sends nothing in legacy mode"
events = [{ type = "keydown", key = "Shift", code = "ShiftLeft", location = 1, shift = true, key_code = 16 }]
logical = [{ type = "key", code = "ShiftLeft", key = "Shift", mods = ["shift"], kind = "press", location = 1 }]
expect = ""
source = "xterm ctlseqs: modifier keys have no encoding"
