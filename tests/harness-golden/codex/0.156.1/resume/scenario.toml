# Codex: a second run takes up the session of the first run (codex resume --last). The scenario "startup" runs first, in the same scratch tree, and is not recorded.
harness = "codex"
after = "startup"
args = ["resume", "--last"]
cols = 120
rows = 40

[[turn]]
blocks = [{ type = "text", text = "Second answer." }]

# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
pattern = "(?m)^  \\d\\d:\\d\\d$"
with = "  <time>"

[[mask]]
pattern = "codex resume [0-9a-f-]{36}"
with = "codex resume <session>"

# Codex asks to trust the hooks of a new config. The scenario picks "Trust all and continue".
[[step]]
wait_screen = "Hooks need review"

[[step]]
snapshot = "hooks-review"

[[step]]
key = "down"

[[step]]
key = "enter"

[[step]]
wait_screen = "^› Ask Codex to do anything"

[[step]]
snapshot = "resumed"

# Codex starts the session (and the SessionStart hook) when the first prompt is submitted.
# Codex takes keys that come in a burst for a paste, and then Enter adds a new line instead of
# sending the prompt. The pause is pacing, not synchronization.
[[step]]
send = "say it again"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
wait_screen = "Second answer\\."

[[step]]
snapshot = "answered"

[[step]]
send = "/exit"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
expect_exit = true
