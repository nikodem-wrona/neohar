events = [{ type = "keydown", key = "F18", code = "F18", ctrl = true }]
logical = [{ type = "key", code = "F18", key = "F18", mods = ["ctrl"], kind = "press" }]
expect = "1b5b33323b357e"
source = "xterm ctlseqs: PC-Style Function Keys, VT220 F13 to F20; terminfo xterm-256color"

