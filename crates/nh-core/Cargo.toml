[package]
name = "nh-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["fsevents"]
# The watches of `config.toml` and of the harness manifests use the watcher of the system: FSEvents
# on macOS, inotify on Linux. FSEvents links CoreServices, and loading it costs about 1 ms at each
# start of a process. `nh` links the core for `nh daemon`, and the hook shim has a budget of 5 ms,
# so `nh` turns the feature off, and its watches poll once a second.
fsevents = ["dep:notify"]
# The `debug.*` methods of the API. The tests, `nh-chaos`, `nh-golden` and `nh` with the feature
# `dev-ws` turn it on. The app does not, so a release has no debug methods.
debug = []
# A WebSocket transport, for development and for the tests. It binds 127.0.0.1 and asks for a
# token. A release of the product never has it. The JSON-RPC loop that it uses (`ws_rpc`) is in
# every build, because the listener of the phone uses it too.
dev-ws = []

[dependencies]
arc-swap.workspace = true
base64.workspace = true
blake3.workspace = true
futures-util.workspace = true
getrandom.workspace = true
nh-agents = { path = "../nh-agents" }
nh-proto = { path = "../nh-proto", features = ["api"] }
nh-redact = { path = "../nh-redact" }
nh-rich = { path = "../nh-rich" }
nh-store = { path = "../nh-store" }
nh-term = { path = "../nh-term" }
notify = { workspace = true, optional = true }
postcard.workspace = true
# The QR code of the pairing of a phone, as SVG. Pure Rust, without its image backend.
qrcode.workspace = true
rustix = { workspace = true, features = ["fs", "process", "system"] }
async-trait.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
# The log of a host: the app and `nh daemon` share it.
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[dev-dependencies]
proptest.workspace = true
nh-store = { path = "../nh-store", features = ["fault-injection"] }
nh-term = { path = "../nh-term", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
