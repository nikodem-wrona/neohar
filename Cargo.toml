[workspace]
members = ["apps/desktop/src-tauri", "crates/*", "packages/proto-wasm", "tools/mock-llm", "tools/nh-*"]
resolver = "3"

[workspace.package]
version = "2.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/nikodem-wrona/neohar"
rust-version = "1.99"

[workspace.dependencies]
# The push of the phone: RFC 8291 and RFC 8292 with RustCrypto.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
alacritty_terminal = "0.26"
anyhow = "1.0"
arc-swap = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bitflags = { version = "2.13", features = ["serde"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = { version = "4", default-features = false }
async-trait = "0.1"
blake3 = { version = "1", default-features = false }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
hkdf = "0.13"
http-body-util = "0.1"
# The listener of the phone: HTTP/1 only, with the upgrade of `/rpc` to a WebSocket.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
insta = { version = "1", features = ["json"] }
libc = "0.2"
# The watcher of the system for nh-core with the feature `fsevents`: the app has it, `nh` does not.
notify = "8"
polling = "3.11"
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "getrandom", "std"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1.11"
proptest-derive = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
vte = "0.15"
webpki-roots = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
semver = { version = "1", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
# The TLS client of the push: the provider `ring` builds with `cc` only, and the roots of
# `webpki-roots` need no framework of the system, so `nh` still links only libSystem.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0"
tokio = { version = "1.53", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std"] }
unicode-segmentation = "1.12"
wasm-bindgen = "=0.2.129"
zstd = { version = "0.14", default-features = false }
ulid = { version = "3.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The snapshot check of the VT engine feeds tens of megabytes through the VT engine, and `mise run test`
# runs it in the test profile. These crates are built with optimizations there. Debug assertions
# and overflow checks stay on.
[profile.dev.package.alacritty_terminal]
opt-level = 3
[profile.dev.package.vte]
opt-level = 3
[profile.dev.package.nh-term]
opt-level = 3
[profile.dev.package.nh-snapcheck]
opt-level = 3
[profile.dev.package.nh-fixture]
opt-level = 3
[profile.dev.package.nh-proto]
opt-level = 3
# Highlighting and diffs (`nh-rich`): `syntect` runs a regex engine over every line. A debug build is
# 12 times slower, and a diff of 2,000 lines takes seconds.
[profile.dev.package.nh-rich]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
# The test of the scrollback archive writes a million lines through SQLite and zstd.
[profile.dev.package.nh-store]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

# The WASM frame decoder: small, and it aborts on a panic. The core keeps unwinding.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
strip = true
