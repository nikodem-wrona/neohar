# Claude Code: a hook reply with wrong field names (tool_name, rule_content) fails validation, and Claude Code shows its own dialog.
harness = "claude"
cols = 120
rows = 40


[state]
hasSeenAutoDefaultNudge = true

[settings.permissions]
defaultMode = "default"

[[hook_reply]]
event = "PermissionRequest"
reply = { hookSpecificOutput = { hookEventName = "PermissionRequest", decision = { behavior = "allow", updatedPermissions = [{ type = "addRules", rules = [{ tool_name = "Bash", rule_content = "touch:*" }], behavior = "allow", destination = "session" }] } } }

[[turn]]
blocks = [{ type = "tool_use", name = "Bash", input = { command = "touch a.txt", description = "First note" } }]

[[turn]]
blocks = [{ type = "text", text = "The note is made." }]

# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
# Claude Code names the time it worked with a verb that it picks at random.
pattern = "✻ \\S+ for [0-9hms ]+ · done \\d+:\\d+ [AP]M"
with = "✻ <verb> for <time spent> · done <time>"

[[mask]]
pattern = "claude --resume [0-9a-f-]{36}"
with = "claude --resume <session>"

[[mask]]
# The dot in front of a running tool call blinks. A screen can show it or not.
pattern = "(?m)^[⏺ ] ?First note$"
with = "<dot> First note"

[[step]]
wait_signal = "SessionStart"

[[step]]
wait_screen = "^❯"

[[step]]
send = "make a note"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_screen = "Do you want to proceed"

[[step]]
snapshot = "dialog"

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
snapshot = "done"


[[step]]
send = "/exit"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
expect_exit = true
