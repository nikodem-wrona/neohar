# Claude Code headless: AskUserQuestion arrives as a can_use_tool control_request. The answer is in updatedInput.answers.
harness = "claude"
mode = "pipe"
args = ["-p", "--output-format", "stream-json", "--input-format", "stream-json", "--verbose", "--permission-prompt-tool", "stdio"]

[state]
hasSeenAutoDefaultNudge = true

[settings.permissions]
defaultMode = "default"

[[turn]]
blocks = [{ type = "tool_use", name = "AskUserQuestion", input = { questions = [{ question = "Which color do you want?", header = "Color", multiSelect = false, options = [{ label = "Red", description = "A warm color" }, { label = "Blue", description = "A cool color" }] }] } }]

[[turn]]
blocks = [{ type = "text", text = "Noted." }]


[[step]]
send_json = { type = "user", message = { role = "user", content = "ask me a question" } }

[[step]]
respond = { behavior = "allow", updatedInput = { questions = [{ question = "Which color do you want?", header = "Color", multiSelect = false, options = [{ label = "Red", description = "A warm color" }, { label = "Blue", description = "A cool color" }] }], answers = { "Which color do you want?" = "Red" } } }

[[step]]
wait_line = '"type":"result"'

[[step]]
close_stdin = true

[[step]]
expect_exit = true
