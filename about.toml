# The configuration of cargo-about. `mise run gen:notices` (scripts/gen-notices.ts) reads it and
# writes THIRD_PARTY_LICENSES.md for the crates that ship in neohar.app.
# Keep `accepted` the same as the `allow` list of the licenses in deny.toml.
accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

# The platforms of the app: macOS and Linux. The script gives the WASM target to proto-wasm.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

# Only the code that goes into the binaries. Build scripts and tests do not ship.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The workspace crates are the work of neohar itself (LICENSE).
private = { ignore = true }
