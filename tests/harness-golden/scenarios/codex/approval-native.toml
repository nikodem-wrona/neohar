# Codex asks for approval (on-request, require_escalated) and nobody answers by hook. The dialog takes enter for Yes.
harness = "codex"
cols = 120
rows = 40

[settings]
approval_policy = "on-request"
sandbox_mode = "read-only"
[[turn]]
blocks = [{ type = "text", text = "I will make a note." }, { type = "tool_use", name = "exec_command", input = { cmd = "touch note.txt", sandbox_permissions = "require_escalated", justification = "Make a note" } }]

[[turn]]
blocks = [{ type = "text", text = "Done." }]


# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
pattern = "(?m)^  \\d\\d:\\d\\d$"
with = "  <time>"

[[mask]]
pattern = "codex resume [0-9a-f-]{36}"
with = "codex resume <session>"

[[mask]]
# The output of a command starts with the id of a chunk of output.
pattern = "Chunk ID: [0-9a-f]+"
with = "Chunk ID: <id>"

[[step]]
wait_screen = "Hooks need review"

[[step]]
snapshot = "hooks-review"

[[step]]
key = "down"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_screen = "^› Ask Codex to do anything"

[[step]]
snapshot = "prompt"

[[step]]
send = "make a note"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_screen = "Would you like to run"

[[step]]
sleep_ms = 500

[[step]]
snapshot = "dialog"

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
snapshot = "done"

[[step]]
send = "/exit"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
expect_exit = true
