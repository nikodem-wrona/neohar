# Claude Code headless: the client sends an interrupt control_request while a can_use_tool request waits.
harness = "claude"
mode = "pipe"
args = ["-p", "--output-format", "stream-json", "--input-format", "stream-json", "--verbose", "--permission-prompt-tool", "stdio"]

[state]
hasSeenAutoDefaultNudge = true

[settings.permissions]
defaultMode = "default"

[[turn]]
blocks = [{ type = "text", text = "I will make a note." }, { type = "tool_use", name = "Bash", input = { command = "touch note.txt", description = "Create a note" } }]

[[turn]]
blocks = [{ type = "text", text = "This turn must not be used." }]


[[step]]
send_json = { type = "user", message = { role = "user", content = "make a note" } }

[[step]]
wait_line = '"subtype":"can_use_tool"'

[[step]]
send_json = { type = "control_request", request_id = "golden-interrupt-1", request = { subtype = "interrupt" } }

[[step]]
wait_line = '"type":"result"'

[[step]]
close_stdin = true

[[step]]
expect_exit = true
