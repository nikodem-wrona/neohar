# Claude Code: a second run takes up the session of the first run (claude --continue). The scenario "startup" runs first, in the same scratch tree, and is not recorded.
harness = "claude"
after = "startup"
cols = 120
rows = 40
args = ["--continue"]

[[turn]]
blocks = [{ type = "text", text = "Second answer." }]

# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
# Claude Code names the time it worked with a verb that it picks at random.
pattern = "✻ \\S+ for [0-9hms ]+ · done \\d+:\\d+ [AP]M"
with = "✻ <verb> for <time spent> · done <time>"

[[mask]]
pattern = "claude --resume [0-9a-f-]{36}"
with = "claude --resume <session>"

[[step]]
wait_signal = "SessionStart"

[[step]]
wait_screen = "^❯"

[[step]]
snapshot = "resumed"

[[step]]
send = "say it again"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
snapshot = "answered"

[[step]]
send = "/exit"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
expect_exit = true
