# The prices of the models, in US dollars for one million tokens.
#
# The core uses a price only when the harness does not report the cost itself, and never for a run
# with `billing = "subscription"`. A model is found by the longest `prefix` of its id, so
# `claude-opus-4-5-20251101` finds `claude-opus-4-5`. A model that no prefix fits has no cost.
#
# Copied on 2026-10-10 from:
#   Claude: https://claude.com/pricing and https://platform.claude.com/docs/en/about-claude/pricing
#   Codex:  https://developers.openai.com/api/docs/pricing (the standard tier)
# The cost of Claude Opus 5.5 for input and output is the figure of the cost lines in the
# golden recordings (`headless-cost`), to the cent of a cent.
#
# `cache_write` is the price of a write to the cache of 5 minutes, and `cache_write_1h` the price
# of 1 hour (it is `cache_write` when missing). OpenAI does not charge for a write. A model with a
# `[model.long]` table has a second price for a prompt of more than `over` tokens. Prices that are
# not here: fast mode (Opus 5.5 at twice the price), batch use, and inference in the US only.
# A price for a model that the page lists with no cache price (the `-pro` models) uses the input
# price for `cache_read`.

[meta]
date = "2026-10-10"

# --- Claude ---

