# Codex: a PreToolUse hook answers allow for a Bash command. The command runs.
harness = "codex"
cols = 120
rows = 40

[[hook_reply]]
event = "PreToolUse"
reply = { hookSpecificOutput = { hookEventName = "PreToolUse", permissionDecision = "allow" } }

[[turn]]
blocks = [{ type = "text", text = "I will make a note." }, { type = "tool_use", name = "exec_command", input = { cmd = "touch note.txt" } }]

[[turn]]
blocks = [{ type = "text", text = "Done." }]

# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
pattern = "(?m)^  \\d\\d:\\d\\d$"
with = "  <time>"

[[mask]]
pattern = "codex resume [0-9a-f-]{36}"
with = "codex resume <session>"

[[mask]]
# The output of a command starts with the id of a chunk of output.
pattern = "Chunk ID: [0-9a-f]+"
with = "Chunk ID: <id>"

[[step]]
wait_screen = "Hooks need review"

[[step]]
snapshot = "hooks-review"

[[step]]
key = "down"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_screen = "^› Ask Codex to do anything"

[[step]]
snapshot = "prompt"

[[step]]
send = "make a note"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
snapshot = "done"

[[step]]
send = "/exit"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
expect_exit = true
