# Codex accepts --disable daemon_auto_start (the feature is off by default in this version). The process list is the same.
harness = "codex"
cols = 120
rows = 40
args = ["--disable", "daemon_auto_start"]

[[turn]]
blocks = [{ type = "text", text = "Hello from the mock model." }]

# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
pattern = "(?m)^  \\d\\d:\\d\\d$"
with = "  <time>"

[[mask]]
pattern = "codex resume [0-9a-f-]{36}"
with = "codex resume <session>"

[[mask]]
# The output of a command starts with the id of a chunk of output.
pattern = "Chunk ID: [0-9a-f]+"
with = "Chunk ID: <id>"

[[step]]
wait_screen = "Hooks need review"

[[step]]
snapshot = "hooks-review"

[[step]]
key = "down"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_screen = "^› Ask Codex to do anything"

[[step]]
snapshot = "prompt"

[[step]]
processes = "idle"

[[step]]
send = "say hello"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
snapshot = "answered"

[[step]]
send = "/exit"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
expect_exit = true
