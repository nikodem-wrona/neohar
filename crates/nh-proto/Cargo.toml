[package]
name = "nh-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The JSON API: envelopes, ids, methods, projections, events and streams, with JSON Schemas.
# The frame and holder types do not need it, so the WASM decoder builds without it.
api = ["dep:base64", "dep:chrono", "dep:schemars", "dep:serde_json"]

[dependencies]
base64 = { workspace = true, optional = true }
bitflags.workspace = true
chrono = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
postcard.workspace = true
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
ulid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
proptest-derive.workspace = true
serde_json.workspace = true
