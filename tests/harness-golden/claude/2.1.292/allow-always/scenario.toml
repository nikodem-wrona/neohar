# Claude Code: a hook allows a tool call and adds a session rule (updatedPermissions, addRules). The second call needs no permission.
harness = "claude"
cols = 120
rows = 40


[state]
hasSeenAutoDefaultNudge = true

[settings.permissions]
defaultMode = "default"

[[hook_reply]]
event = "PermissionRequest"
reply = { hookSpecificOutput = { hookEventName = "PermissionRequest", decision = { behavior = "allow", updatedPermissions = [{ type = "addRules", rules = [{ toolName = "Bash", ruleContent = "touch:*" }], behavior = "allow", destination = "session" }] } } }

[[turn]]
blocks = [{ type = "tool_use", name = "Bash", input = { command = "touch a.txt", description = "First note" } }]

[[turn]]
blocks = [{ type = "tool_use", name = "Bash", input = { command = "touch b.txt", description = "Second note" } }]

[[turn]]
blocks = [{ type = "text", text = "Both notes are made." }]

# Text that differs from run to run is hidden when two recordings are compared.
[[mask]]
# Claude Code names the time it worked with a verb that it picks at random.
pattern = "✻ \\S+ for [0-9hms ]+ · done \\d+:\\d+ [AP]M"
with = "✻ <verb> for <time spent> · done <time>"

[[mask]]
pattern = "claude --resume [0-9a-f-]{36}"
with = "claude --resume <session>"

[[step]]
wait_signal = "SessionStart"

[[step]]
wait_screen = "^❯"

[[step]]
send = "make two notes"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
wait_signal = "Stop"

[[step]]
snapshot = "done"


[[step]]
send = "/exit"

[[step]]
sleep_ms = 300

[[step]]
key = "enter"

[[step]]
expect_exit = true
