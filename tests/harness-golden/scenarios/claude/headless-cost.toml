# Claude Code headless: two turns in one session. total_cost_usd in the result messages grows by the cost of each turn (it is a total, not a delta).
harness = "claude"
mode = "pipe"
args = ["-p", "--output-format", "stream-json", "--input-format", "stream-json", "--verbose", "--permission-prompt-tool", "stdio"]

[state]
hasSeenAutoDefaultNudge = true

[settings.permissions]
defaultMode = "default"

[[turn]]
blocks = [{ type = "text", text = "First answer." }]

[[turn]]
blocks = [{ type = "text", text = "Second answer." }]


[[step]]
send_json = { type = "user", message = { role = "user", content = "first question" } }

[[step]]
wait_line = '"type":"result"'

[[step]]
send_json = { type = "user", message = { role = "user", content = "second question" } }

[[step]]
wait_line = '"type":"result"'

[[step]]
close_stdin = true

[[step]]
expect_exit = true
